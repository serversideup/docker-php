##
# Performance Configuration
##

# Static asset caching, matching the fpm-nginx variation
# (server-opts.d/performance.conf).
#
# Cache-Control is only set when the response has none yet, so an
# application's own rules win: mod_expires or "Header set" / "Header always
# set" rules in an .htaccess file. %{resp:...} reads both header tables;
# "setifempty" would only see the one "Header set" writes to.
#
# <FilesMatch> matches the file Apache serves. A request for a missing
# asset that a rewrite passes to index.php gets no header from here.

# Assets and media
<FilesMatch "\.(?:css(\.map)?|js(\.map)?|jpe?g|png|gif|ico|cur|heic|webp|tiff?|mp3|m4a|aac|ogg|midi?|wav|mp4|mov|webm|mpe?g|avi|ogv|flv|wmv|svgz?)$">
    Header set Cache-Control "public, max-age=31536000, immutable" "expr=-z %{resp:Cache-Control}"
</FilesMatch>

# Fonts
<FilesMatch "\.(?:ttf|ttc|otf|eot|woff2?)$">
    Header set Access-Control-Allow-Origin "*" "expr=-z %{resp:Access-Control-Allow-Origin}"
    Header set Cache-Control "public, max-age=31536000, immutable" "expr=-z %{resp:Cache-Control}"
</FilesMatch>

# Remove the ETag of a compressed response. By default mod_deflate appends
# "-gzip" to it and then never matches that ETag in If-None-Match, so
# revalidating a compressed response always returns 200 with the full body.
# Without the ETag, browsers revalidate with If-Modified-Since and get 304.
# "NoChange" would give the gzip and identity responses one strong ETag,
# which lets an If-Range request mix their bytes.
# https://httpd.apache.org/docs/2.4/mod/mod_deflate.html#deflatealteretag
<IfModule mod_deflate.c>
    DeflateAlterETag Remove
</IfModule>

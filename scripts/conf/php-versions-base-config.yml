# Every version that ships in the image, other than PHP (read from php.net at build time)
# and NGINX (operating_systems below). Each key is passed to the Dockerfiles as a build arg
# of the same name. Renovate reads the comments and opens
# a pull request when a newer version is out (see renovate.json).
dependencies:
  # The docker-library/php commit the PHP base images are compiled from. Renovate moves it
  # to the latest commit on master once a week and merges it when every check passes. A minor version can pin its own with docker_library_ref.
  DOCKER_LIBRARY_PHP_REF: 5ec2a6a0dad498e89a91a39454dbb52e98ce2bdb
  # renovate: datasource=github-releases depName=phpredis/phpredis
  PHPREDIS_VERSION: 6.3.0
  # The liblzf commit that phpredis bundles as a submodule. GitHub tarballs leave submodules
  # out, so it is downloaded separately. Check it when bumping phpredis:
  # gh api repos/phpredis/phpredis/contents/liblzf?ref=<version> --jq .sha
  PHPREDIS_LIBLZF_REF: fb25820c3c0aeafd127956ae6c115063b47e459a
  # renovate: datasource=github-releases depName=mlocati/docker-php-extension-installer
  PHP_EXT_INSTALLER_VERSION: 2.12.6
  # renovate: datasource=github-releases depName=just-containers/s6-overlay versioning=loose
  S6_VERSION: v3.2.3.2
  # renovate: datasource=github-releases depName=renatomefi/php-fpm-healthcheck
  PHP_FPM_HEALTHCHECK_VERSION: v0.6.0
  # renovate: datasource=github-releases depName=php/frankenphp
  FRANKENPHP_VERSION: 1.13.4
  # renovate: datasource=docker depName=golang
  GOLANG_VERSION: "1.27"
  # renovate: datasource=github-releases depName=e-dant/watcher
  WATCHER_VERSION: 0.14.5

# php_base is the docker-library/php variant each variation is built on. A minor version
# can swap it with php_base_overrides (8.6 has no separate zts variant, for example).
php_variations:
  - name: cli
    php_base: cli
    default: true
  - name: fpm
    php_base: fpm
  - name: fpm-apache
    php_base: fpm
    supported_os: # Open a discussion on serversideup/php if you want to see Alpine support for fpm-apache (https://github.com/serversideup/docker-php/discussions/66)
      - bookworm
      - trixie
  - name: fpm-nginx
    php_base: fpm
  - name: frankenphp
    php_base: zts
    excluded_minor_versions:
      - "8.1"
      - "8.2"

php_versions:
  - major: "8"
    minor_versions:
      # PHP 8.1 is end of life, so php.net no longer lists it in the active releases feed
      # and the patch version must be pinned here. docker-library/php removed 8.1 from master,
      # so it builds from the last commit that had it ("Update 8.1 to 8.1.34"). Debian Bookworm,
      # Trixie, and Alpine 3.22 still receive security updates, so weekly rebuilds keep
      # delivering OS patches.
      - minor: "8.1"
        docker_library_ref: 5c037abaf9dc0095e29807c048d9d1b97e6a9716
        base_os:
          - name: alpine3.22
          - name: bookworm
          - name: trixie
        patch_versions:
          - 8.1.34
      - minor: "8.2"
        base_os:
          - name: alpine3.23
          - name: alpine3.24
          - name: bookworm
          - name: trixie
        patch_versions:
        #   - 8.2.32 # Pull latest from Official PHP source
      - minor: "8.3"
        base_os:
          - name: alpine3.23
          - name: alpine3.24
          - name: bookworm
          - name: trixie
        patch_versions:
          # - 8.3.32 # Pull latest from Official PHP source
      - minor: "8.4"
        base_os:
          - name: alpine3.23
          - name: alpine3.24
          - name: bookworm
          - name: trixie
        patch_versions:
        #   - 8.4.23 # Pull latest from Official PHP source
      - minor: "8.5"
        base_os:
          - name: alpine3.23
          - name: alpine3.24
          - name: bookworm
          - name: trixie
        patch_versions:
        #   - 8.5.8 # Pull latest from Official PHP source
      # "8.6-rc" builds the newest release candidate php.net lists. docker-library builds
      # every 8.6 image with ZTS and has no separate zts variant, so FrankenPHP uses cli.
      - minor: "8.6-rc"
        base_os:
          - name: alpine3.23
          - name: alpine3.24
          - name: bookworm
          - name: trixie
        patch_versions:
          - 8.6-rc
        php_base_overrides:
          frankenphp: cli
        # phpredis 6.3.0 does not compile on PHP 8.6, so 8.6 builds the last develop commit
        # before #2959. That change added an enable-redis-phpser build option, and
        # install-php-extensions answers phpredis's build prompts in order, so newer commits
        # turn on phpser and fail. Remove this once a phpredis release supports PHP 8.6.
        php_extension_overrides:
          - redis=phpredis/phpredis@810984b5a5aedc37e3ff3c19e33af8dc08c8290f

operating_systems:
  - family: alpine
    versions:
      - name: "Alpine 3.22"
        version: alpine3.22
        number: 3.22
        nginx_version: 1.30.6-r1
      - name: "Alpine 3.23"
        version: alpine3.23
        number: 3.23
        nginx_version: 1.30.6-r1
      - name: "Alpine 3.24"
        version: alpine3.24
        number: 3.24
        nginx_version: 1.30.6-r1
  - family: debian
    default: true
    versions:
      - name: "Debian Bookworm"
        version: bookworm
        number: 12
        nginx_version: 1.30.6-1~bookworm
      - name: "Debian Trixie"
        version: trixie
        number: 13
        nginx_version: 1.30.6-1~trixie

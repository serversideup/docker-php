name: Docker Publish (v4 Backport)

# v4 backports publish release tags only (e.g. 8.4-fpm-nginx-v4.5.2). Floating tags belong to v5,
# so this never runs on a release event or schedule. Run it manually from a v4 release tag.
on:
  workflow_dispatch:

jobs:
  build-production-images:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v4.')
    uses: ./.github/workflows/service_docker-build-and-publish.yml
    with:
      registry-repositories: "docker.io/serversideup/php,ghcr.io/serversideup/php"
      tag-prefix: ''
      release-type: "latest"
      ref: ${{ github.ref }}
    secrets: inherit

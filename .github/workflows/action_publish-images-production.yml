name: Docker Publish (Production Images)
run-name: >-
  Production images (${{
    (github.ref_type == 'tag' && github.ref_name) ||
    (github.event_name == 'schedule' && 'weekly rebuild') ||
    'manual rebuild'
  }})

# Releasing: write the notes as a draft release (optional), then push the version tag from the
# branch to release. The images are built, tested, and published before the release is, because
# publishing a release locks its tag. If the build fails, delete the tag, fix it, and push it again.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  schedule:
    - cron: '0 8 * * 2'

# A release and the weekly rebuild must not publish the same tags at the same time.
concurrency:
  group: production-images

permissions: {}

jobs:
  release:
    # Forks inherit the cron schedule. Their weekly rebuilds always fail and email whoever last edited the schedule upstream.
    if: github.event_name != 'schedule' || github.repository == 'serversideup/docker-php'
    name: resolve release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.release.outputs.ref }}
      release-tag: ${{ steps.release.outputs.release-tag }}
      floating-tags: ${{ steps.release.outputs.floating-tags }}
      publish-release: ${{ steps.release.outputs.publish-release }}
    steps:
      - name: Find the release to build
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUSHED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          # GitHub's "Latest" label can't decide this: a pushed release isn't published yet.
          published_releases() {
            gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$'
          }

          if [ -z "$PUSHED_TAG" ]; then
            TAG=$(published_releases | sort -V | tail -n1)
            if [ -z "$TAG" ]; then
              echo "::error title=No release found::Could not find a published release to build."
              exit 1
            fi
            echo "Rebuilding release $TAG"
            {
              echo "ref=$TAG"
              echo "release-tag="
              echo "floating-tags=true"
              echo "publish-release=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SORTED=$( (published_releases; echo "$PUSHED_TAG") | sort -uV)
          NEWEST=$(echo "$SORTED" | tail -n1)
          PREVIOUS=$(echo "$SORTED" | grep -B1 -xF "$PUSHED_TAG" | grep -vxF "$PUSHED_TAG" || true)

          # Publishing a release in the GitHub UI also pushes its tag. Its images still get built.
          if published_releases | grep -xF "$PUSHED_TAG" > /dev/null; then
            echo "::warning title=Release already published::$PUSHED_TAG was published before its images were built, so its tag is locked even if this build fails. Next time, push the tag instead."
            PUBLISH_RELEASE=false
          elif gh release view "$PUSHED_TAG" > /dev/null 2>&1; then
            echo "Using the draft release notes for $PUSHED_TAG"
            PUBLISH_RELEASE=true
          else
            gh release create "$PUSHED_TAG" --draft --verify-tag --title "$PUSHED_TAG" --generate-notes ${PREVIOUS:+--notes-start-tag "$PREVIOUS"}
            echo "Created a draft release for $PUSHED_TAG with generated notes"
            PUBLISH_RELEASE=true
          fi

          if [ "$NEWEST" = "$PUSHED_TAG" ]; then
            echo "Releasing $PUSHED_TAG as the newest release"
            FLOATING=true
          else
            echo "Releasing $PUSHED_TAG with release tags only, because $NEWEST is newer"
            FLOATING=false
          fi
          {
            echo "ref=$PUSHED_TAG"
            echo "release-tag=$PUSHED_TAG"
            echo "floating-tags=$FLOATING"
            echo "publish-release=$PUBLISH_RELEASE"
          } >> "$GITHUB_OUTPUT"

  setup:
    needs: release
    uses: ./.github/workflows/service_setup-matrix.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.release.outputs.ref }}

  # PHP compiled from php.net, so a release never waits for Docker Hub.
  base:
    needs: [release, setup]
    uses: ./.github/workflows/service_build-base-images.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      image-prefix: "ghcr.io/serversideup/php-base:"
      ref: ${{ needs.release.outputs.ref }}

  build:
    needs: [release, setup, base]
    name: build ${{ matrix.variation }}
    strategy:
      fail-fast: false
      matrix:
        variation: ${{ fromJson(needs.setup.outputs.variations) }}
    permissions:
      contents: read
      id-token: write
      packages: read
    uses: ./.github/workflows/service_build-images.yml
    with:
      variation: ${{ matrix.variation }}
      matrix: ${{ needs.setup.outputs.matrix }}
      ref: ${{ needs.release.outputs.ref }}
      registry-repositories: "docker.io/serversideup/php,ghcr.io/serversideup/php"
      base-images: ${{ needs.base.outputs.base-images }}
      tag-prefix: ''
      release-type: "latest"
      release-tag: ${{ needs.release.outputs.release-tag }}
      floating-tags: ${{ needs.release.outputs.floating-tags == 'true' }}
    secrets: inherit

  test:
    needs: [release, setup, build]
    if: always() && needs.setup.result == 'success'
    uses: ./.github/workflows/service_test-images.yml
    permissions:
      contents: read
      id-token: write
    with:
      ref: ${{ needs.release.outputs.ref }}

  # Only images that passed the image tests reach a public registry.
  publish:
    needs: [release, build, test]
    if: needs.build.result == 'success' && needs.test.result == 'success'
    uses: ./.github/workflows/service_publish-images.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      ref: ${{ needs.release.outputs.ref }}
    secrets: inherit

  # Publishing the release locks its tag, so it waits until every image is live.
  finalize:
    needs: [release, publish]
    if: needs.release.outputs.publish-release == 'true'
    name: publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.release-tag }}
          LATEST: ${{ needs.release.outputs.floating-tags }}
        run: gh release edit "$VERSION" --draft=false --latest="$LATEST"

  report:
    needs: [release, setup, build, test, publish]
    if: always() && needs.setup.result == 'success'
    uses: ./.github/workflows/service_report.yml
    permissions:
      contents: read
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      ref: ${{ needs.release.outputs.ref }}

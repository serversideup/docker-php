name: OpenSSF Scorecard

# Scores the repository's supply chain practices (pinned dependencies, token permissions,
# signed releases, branch protection, and more) and publishes the result to
# scorecard.dev, which serves the badge in the README. Publishing only works while this
# workflow follows Scorecard's rules: no workflow-level env, defaults, or write
# permissions, and only Scorecard's approved actions in the job.
on:
  workflow_dispatch:
  branch_protection_rule:
  push:
    branches:
      - main
  schedule:
    - cron: '41 6 * * 3'

permissions: {}

jobs:
  analysis:
    # Forks inherit the cron schedule. Their weekly rebuilds always fail and email whoever last edited the schedule upstream.
    if: github.event_name != 'schedule' || github.repository == 'serversideup/docker-php'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the results to the Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif

name: Report

# Collects the image details every build job records and renders one table for the
# whole run: each image with its compressed size per architecture and a pull command.
on:
  workflow_call:
    inputs:
      matrix:
        type: string
        default: '{}'
        description: 'Build matrix JSON keyed by variation, used to list images that did not build.'
    outputs:
      markdown:
        description: 'The rendered Markdown table'
        value: ${{ jobs.summary.outputs.markdown }}

jobs:
  summary:
    name: images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      markdown: ${{ steps.render.outputs.markdown }}
    steps:
      # The commit that started the run, never a pull request's: a maintainer-dispatched
      # build of a fork's pull request must not run the fork's copy of build-summary.sh.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download image details from every build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-details-*
          path: image-details
          merge-multiple: true

      - name: Render the summary table
        id: render
        env:
          MATRIX: ${{ inputs.matrix }}
        run: |
          bash scripts/build-summary.sh image-details "$MATRIX" > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo "markdown<<SUMMARY_EOF"
            cat summary.md
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

name: Test Images

# Phase 2 of 3: pull every image the build phase saved to the Depot Registry and run
# scripts/test-image.sh against each one on native amd64 and arm64 runners.
# Images are grouped by PHP version and base OS so one job pulls the variations that
# share the same base layers. The jobs run on Depot runners (Depot sponsors this
# project), which pull from the Depot Registry inside Depot's own network and have
# no shared concurrency cap. Publishing only happens if this phase passes.
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ${{ github.ref }}
        description: 'The git ref to checkout (branch, tag, or commit SHA)'

jobs:
  list:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - name: Download image details from every build job
        uses: actions/download-artifact@v8
        with:
          pattern: image-details-*
          path: image-details
          merge-multiple: true

      - name: Group the saved images by PHP version and base OS, on both architectures
        id: list
        run: |
          MATRIX=$(find image-details -name '*.json' -print0 | xargs -0 -r jq -s -c '
            [ .[] | select(.saved != null) ]
            | group_by([.php, .os])
            | map({ php: .[0].php, os: .[0].os, images: (sort_by(.variation) | map({variation, saved}) | tojson) })
            | { include: [ .[]
                + ({ runner: "depot-ubuntu-24.04", arch: "amd64" }, { runner: "depot-ubuntu-24.04-arm", arch: "arm64" }) ] }')
          MATRIX="${MATRIX:-{\"include\":[]\}}"
          COUNT=$(echo "$MATRIX" | jq '[.include[].images | fromjson | length] | add // 0')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" = "0" ]; then
            echo "::notice title=No saved images::Nothing was saved to the Depot Registry, so there is nothing to test here. Pull requests from forks are tested inside their build jobs."
          fi
          echo "$COUNT image tests in $(echo "$MATRIX" | jq '.include | length') jobs:"
          echo "$MATRIX" | jq -r '.include[] | "  \(.php)-\(.os) on \(.arch): \(.images | fromjson | map(.variation) | join(", "))"'

  images:
    needs: list
    if: needs.list.outputs.count > 0
    name: ${{ matrix.php }}-${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.list.outputs.matrix) }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Depot CLI
        uses: depot/setup-action@v1
        with:
          oidc: true

      - name: Login to the Depot Registry
        run: docker login registry.depot.dev --username x-token --password-stdin <<< "$(depot pull-token)"

      # Every image in the group is tested even after one fails, so a run shows every
      # broken image at once instead of one per attempt.
      - name: Test every image in the group
        env:
          IMAGES: ${{ matrix.images }}
          PHP: ${{ matrix.php }}
        run: |
          FAILED=()
          while IFS=$'\t' read -r VARIATION SAVED; do
            echo "::group::${VARIATION} ${PHP}-${{ matrix.os }} ${{ matrix.arch }}"
            if ! { docker pull --quiet "$SAVED" && bash scripts/test-image.sh "$SAVED" "$PHP"; }; then
              FAILED+=("$VARIATION")
            fi
            echo "::endgroup::"
          done < <(echo "$IMAGES" | jq -r '.[] | [.variation, .saved] | @tsv')

          if [ "${#FAILED[@]}" -gt 0 ]; then
            echo "::error title=Image tests failed::${FAILED[*]} failed for ${PHP}-${{ matrix.os }} on ${{ matrix.arch }}"
            exit 1
          fi

name: Smoke Test

# Phase 2 of 3: pull every image the build phase saved to the Depot Registry and run
# scripts/smoke-test.sh against each one on native amd64 and arm64 runners.
# Publishing only happens if this phase passes.
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ${{ github.ref }}
        description: 'The git ref to checkout (branch, tag, or commit SHA)'

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}
      count: ${{ steps.images.outputs.count }}
    steps:
      - name: Download image details from every build job
        uses: actions/download-artifact@v8
        with:
          pattern: image-details-*
          path: image-details
          merge-multiple: true

      - name: List every saved image on both architectures
        id: images
        run: |
          MATRIX=$(find image-details -name '*.json' -print0 | xargs -0 -r jq -s -c '
            { include: [ .[] | select(.saved != null)
              | { variation, php, os, saved }
                + ({ runner: "ubuntu-24.04", arch: "amd64" }, { runner: "ubuntu-24.04-arm", arch: "arm64" }) ] }')
          MATRIX="${MATRIX:-{\"include\":[]\}}"
          COUNT=$(echo "$MATRIX" | jq '.include | length')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "$COUNT image tests:"
          echo "$MATRIX" | jq -r '.include[] | "  \(.variation) \(.php)-\(.os) on \(.arch)"'

  test:
    needs: images
    if: needs.images.outputs.count > 0
    name: ${{ matrix.variation }} ${{ matrix.php }}-${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.images.outputs.matrix) }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Depot CLI
        uses: depot/setup-action@v1
        with:
          oidc: true

      - name: Login to the Depot Registry
        run: docker login registry.depot.dev --username x-token --password-stdin <<< "$(depot pull-token)"

      - name: Pull the image
        run: docker pull --quiet "${{ matrix.saved }}"

      - name: Smoke test
        run: bash scripts/smoke-test.sh "${{ matrix.saved }}" "${{ matrix.php }}"

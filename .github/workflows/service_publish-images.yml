name: Publish Images

# Phase 3 of 3: promote the exact images that passed the image tests from the Depot
# Registry to Docker Hub and GHCR. No rebuild happens here; docker buildx imagetools
# copies each multi-platform image by digest and applies every tag in one step.
on:
  workflow_call:
    inputs:
      authenticate_with_ghcr:
        default: true
        type: boolean
        description: 'Whether to log in to GitHub Container Registry.'
      ref:
        type: string
        default: ${{ github.ref }}
        description: 'The git ref to checkout (branch, tag, or commit SHA)'

jobs:
  list:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - name: Download image details from every build job
        uses: actions/download-artifact@v8
        with:
          pattern: image-details-*
          path: image-details
          merge-multiple: true

      - name: List the images saved for publishing
        id: list
        run: |
          MATRIX=$(find image-details -name '*.json' -print0 | xargs -0 -r jq -s -c '
            { include: [ .[] | select(.saved != null) | { variation, php, os, saved, tags: (.tags | join(",")) } ] }')
          MATRIX="${MATRIX:-{\"include\":[]\}}"
          COUNT=$(echo "$MATRIX" | jq '.include | length')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "$COUNT images to publish"

  publish:
    needs: list
    if: needs.list.outputs.count > 0
    name: ${{ matrix.variation }} ${{ matrix.php }}-${{ matrix.os }}
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.list.outputs.matrix) }}
    env:
      IMAGE_NAME: ${{ matrix.variation }}-${{ matrix.php }}-${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Depot CLI
        uses: depot/setup-action@v1
        with:
          oidc: true

      - name: Login to the Depot Registry
        run: docker login registry.depot.dev --username x-token --password-stdin <<< "$(depot pull-token)"

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        if: ${{ inputs.authenticate_with_ghcr }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the tested image to every tag
        env:
          SAVED: ${{ matrix.saved }}
          TAGS: ${{ matrix.tags }}
        run: |
          TAG_ARGS=()
          for tag in ${TAGS//,/ }; do
            TAG_ARGS+=(--tag "$tag")
          done
          echo "Promoting $SAVED to ${#TAG_ARGS[@]} tags"
          docker buildx imagetools create "${TAG_ARGS[@]}" "$SAVED"

      - name: Record the published image
        env:
          SAVED: ${{ matrix.saved }}
          TAGS: ${{ matrix.tags }}
        run: |
          CANONICAL_TAG="${TAGS%%,*}"
          MANIFEST=$(docker manifest inspect -v "$CANONICAL_TAG") || MANIFEST='[]'
          SIZES=$(echo "$MANIFEST" | jq '
            [ .[] | select(.Descriptor.platform.os == "linux")
              | { key: (.Descriptor.platform.os + "/" + .Descriptor.platform.architecture),
                  value: ([ (.SchemaV2Manifest // .OCIManifest).layers[].size ] | add) } ]
            | from_entries')
          mkdir -p image-details
          jq -n \
            --arg variation "${{ matrix.variation }}" \
            --arg php "${{ matrix.php }}" \
            --arg os "${{ matrix.os }}" \
            --arg tags "$TAGS" \
            --arg saved "$SAVED" \
            --argjson sizes "$SIZES" \
            '{variation: $variation, php: $php, os: $os, tags: ($tags | split(",")), saved: $saved, published: true, sizes: $sizes}' \
            | tee "image-details/${IMAGE_NAME}.json"

      - name: Update image details
        uses: actions/upload-artifact@v7
        with:
          name: image-details-${{ env.IMAGE_NAME }}
          path: image-details/
          retention-days: 7
          overwrite: true

name: Publish Images

# Phase 3 of 3: promote the exact images that passed the image tests from the Depot
# Registry to Docker Hub and GHCR. No rebuild happens here and no image bytes pass
# through the runner: `depot push` copies each saved build to every tag server-side,
# the published digest is checked against the one the build recorded, and each
# registry's copy is signed with cosign. Signing is keyless: the signature is tied to
# this workflow through its OIDC token, so there is no signing key to store or leak. Depot
# sponsors this project, so its runners are used for the phases that do real work.
on:
  workflow_call:
    inputs:
      authenticate_with_ghcr:
        default: true
        type: boolean
        description: 'Whether to log in to GitHub Container Registry.'
      ref:
        type: string
        default: ${{ github.ref }}
        description: 'The git ref to checkout (branch, tag, or commit SHA)'
    secrets:
      DOCKER_HUB_USERNAME:
        required: true
      DOCKER_HUB_ACCESS_TOKEN:
        required: true

jobs:
  list:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - name: Download image details from every build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-details-*
          path: image-details
          merge-multiple: true

      - name: Group the saved images by variation
        id: list
        run: |
          MATRIX=$(find image-details -name '*.json' -print0 | xargs -0 -r jq -s -c '
            [ .[] | select(.saved != null) ]
            | group_by(.variation)
            | { include: map({ variation: .[0].variation, images: (map({php, os, saved, build_id, digest, tags}) | tojson) }) }')
          MATRIX="${MATRIX:-{\"include\":[]\}}"
          COUNT=$(echo "$MATRIX" | jq '[.include[].images | fromjson | length] | add // 0')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "$COUNT images to publish"

  images:
    needs: list
    if: needs.list.outputs.count > 0
    name: ${{ matrix.variation }}
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.list.outputs.matrix) }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Set up Depot CLI
        uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2
        with:
          oidc: true

      - name: Login to DockerHub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: ${{ inputs.authenticate_with_ghcr }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # `depot push` handles one tag at a time, so images are pushed in parallel and each
      # one's output is printed afterwards as its own log group. Every image is attempted
      # even after one fails, so a run shows every image that could not be published at once.
      #
      # Every variation's job starts pushing in the same second, and GHCR allows 2,000
      # requests a minute per token. Eight pushes per job were enough to get every job rate
      # limited (v5.0.0-beta1), and `depot push` does not retry a 429, so the parallelism
      # is kept low and a failed push is retried with a growing pause.
      - name: Promote the tested images to every tag
        env:
          IMAGES: ${{ matrix.images }}
          VARIATION: ${{ matrix.variation }}
          MAX_PARALLEL: 2
          PUSH_ATTEMPTS: 5
        run: |
          PROJECT=$(jq -r .id depot.json)
          mkdir -p image-details logs

          retry() {
            local description="$1" attempt=1
            shift
            until "$@"; do
              if [ "$attempt" -ge "$PUSH_ATTEMPTS" ]; then
                echo "::error title=Publish failed::${description} failed after ${PUSH_ATTEMPTS} attempts"
                return 1
              fi
              local pause=$(( 15 * attempt + RANDOM % 15 ))
              echo "${description}: attempt ${attempt} of ${PUSH_ATTEMPTS} failed, retrying in ${pause}s"
              sleep "$pause"
              attempt=$(( attempt + 1 ))
            done
          }

          publish_image() {
            local php="$1" os="$2" saved="$3" build_id="$4" digest="$5" tags="$6"
            local image_name="${VARIATION}-${php}-${os}"
            local tag tag_args=()
            for tag in ${tags//,/ }; do
              tag_args+=(--tag "$tag")
            done
            echo "Pushing build $build_id to $(( ${#tag_args[@]} / 2 )) tags"
            retry "Pushing ${image_name}" depot push --project "$PROJECT" --progress plain "${tag_args[@]}" "$build_id" || return 1

            # What was published must be what was tested: the tested digest has to appear
            # in the published index (as the index itself or one of its manifests).
            local canonical_tag="${tags%%,*}" index published_digests
            index=$(docker buildx imagetools inspect --raw "$canonical_tag")
            published_digests="sha256:$(printf '%s' "$index" | sha256sum | cut -d' ' -f1) $(echo "$index" | jq -r '.manifests[]?.digest' | tr '\n' ' ')"
            if [ -z "$digest" ]; then
              echo "::warning title=Digest not recorded::${image_name} was published without a digest check because the build did not record one."
            elif [[ " $published_digests " != *" $digest "* ]]; then
              echo "::error title=Digest mismatch::${image_name} published as $published_digests but the tested image was $digest"
              return 1
            else
              echo "Published digest matches the tested image ($digest)"
            fi

            # Every tag in a registry points at the same index, so one signature per registry covers them all.
            local index_digest repository
            index_digest=$(docker buildx imagetools inspect "$canonical_tag" --format '{{json .Manifest.Digest}}' | jq -r .)
            for repository in $(tr ',' '\n' <<< "$tags" | sed 's/:[^:]*$//' | sort -u); do
              retry "Signing ${repository}@${index_digest}" cosign sign --yes "${repository}@${index_digest}" || return 1
            done

            local manifest sizes
            manifest=$(docker manifest inspect -v "$canonical_tag") || manifest='[]'
            sizes=$(echo "$manifest" | jq '
              [ .[] | select(.Descriptor.platform.os == "linux")
                | { key: (.Descriptor.platform.os + "/" + .Descriptor.platform.architecture),
                    value: ([ (.SchemaV2Manifest // .OCIManifest).layers[].size ] | add) } ]
              | from_entries')
            jq -n \
              --arg variation "$VARIATION" \
              --arg php "$php" \
              --arg os "$os" \
              --arg tags "$tags" \
              --arg saved "$saved" \
              --arg build_id "$build_id" \
              --arg digest "$digest" \
              --argjson sizes "$sizes" \
              '{variation: $variation, php: $php, os: $os, tags: ($tags | split(",")), saved: $saved, build_id: $build_id, digest: $digest, published: true, sizes: $sizes}' \
              | tee "image-details/${image_name}.published.json"
          }

          NAMES=()
          # An empty digest is written as "-" because bash collapses consecutive tabs.
          while IFS=$'\t' read -r PHP OS SAVED BUILD_ID DIGEST TAGS; do
            [ "$DIGEST" != "-" ] || DIGEST=""
            IMAGE_NAME="${VARIATION}-${PHP}-${OS}"
            NAMES+=("$IMAGE_NAME")
            while [ "$(jobs -rp | wc -l)" -ge "$MAX_PARALLEL" ]; do sleep 1; done
            (
              publish_image "$PHP" "$OS" "$SAVED" "$BUILD_ID" "$DIGEST" "$TAGS" > "logs/${IMAGE_NAME}.log" 2>&1
              echo $? > "logs/${IMAGE_NAME}.status"
            ) &
          done < <(echo "$IMAGES" | jq -r '.[] | [.php, .os, .saved, .build_id, (.digest | if . == "" then "-" else . end), (.tags | join(","))] | @tsv')
          wait

          FAILED=()
          for IMAGE_NAME in "${NAMES[@]}"; do
            echo "::group::${IMAGE_NAME}"
            cat "logs/${IMAGE_NAME}.log"
            echo "::endgroup::"
            [ "$(cat "logs/${IMAGE_NAME}.status" 2>/dev/null)" = "0" ] || FAILED+=("$IMAGE_NAME")
          done

          if [ "${#FAILED[@]}" -gt 0 ]; then
            echo "::error title=Publish failed::${FAILED[*]} were not published"
            exit 1
          fi

      - name: Record the published images
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-details-published-${{ matrix.variation }}
          path: image-details/
          retention-days: 7
          if-no-files-found: ignore

name: Lint

# Fast checks that run before any image is built. Each job runs one check in scripts/lint.sh,
# which contributors run locally. Add a new linter to that script and as a job here.
on:
  workflow_call:

env:
  # renovate: datasource=github-releases depName=rhysd/actionlint
  ACTIONLINT_VERSION: 1.7.12
  # renovate: datasource=github-releases depName=koalaman/shellcheck
  SHELLCHECK_VERSION: v0.11.0
  # renovate: datasource=github-releases depName=hadolint/hadolint
  HADOLINT_VERSION: v2.15.1
  # renovate: datasource=github-releases depName=zizmorcore/zizmor
  ZIZMOR_VERSION: 1.31.1

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        run: bash scripts/lint.sh actionlint

  # Security audit for the workflows: unpinned actions, template injection, risky triggers,
  # and broad permissions. Its project decisions are recorded in .github/zizmor.yml. The
  # token is read-only and lets it check that every pinned SHA belongs to its repository.
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit GitHub Actions workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/lint.sh zizmor

  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint shell scripts
        run: bash scripts/lint.sh shellcheck

  hadolint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Dockerfiles
        run: bash scripts/lint.sh hadolint

  script-tests:
    name: scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs on a real runner on purpose: tool versions here (jq, yq) are what the
      # publish workflows use, and they differ from laptops.
      - name: Test the CI helper scripts and check the docs match src/
        run: bash scripts/lint.sh scripts

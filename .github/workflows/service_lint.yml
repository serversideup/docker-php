name: Lint

# Fast checks that run before any image is built. Add new linters as jobs here.
# The same commands work locally; see docs/content/docs/1.getting-started/99.contributing.md.
on:
  workflow_call:

env:
  # renovate: datasource=github-releases depName=rhysd/actionlint
  ACTIONLINT_VERSION: 1.7.12
  # renovate: datasource=github-releases depName=koalaman/shellcheck
  SHELLCHECK_VERSION: v0.11.0
  # renovate: datasource=github-releases depName=hadolint/hadolint
  HADOLINT_VERSION: v2.15.1
  # renovate: datasource=github-releases depName=zizmorcore/zizmor
  ZIZMOR_VERSION: 1.31.1

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo "rhysd/actionlint:${ACTIONLINT_VERSION}" -color

  # Security audit for the workflows: unpinned actions, template injection, risky triggers,
  # and broad permissions. Its project decisions are recorded in .github/zizmor.yml. The
  # token is read-only and lets it check that every pinned SHA belongs to its repository.
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit GitHub Actions workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: docker run --rm -e GH_TOKEN -v "$PWD:/repo:ro" -w /repo "ghcr.io/zizmorcore/zizmor:${ZIZMOR_VERSION}" --color=always .github/workflows

  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint shell scripts
        run: |
          # The find output is meant to expand into a list of files.
          # shellcheck disable=SC2046
          docker run --rm -v "$PWD:/repo" -w /repo "koalaman/shellcheck:${SHELLCHECK_VERSION}" \
            --color=always --severity=warning \
            scripts/*.sh \
            scripts/tests/*.sh \
            scripts/tests/image/*.sh \
            src/common/usr/local/bin/* \
            src/s6/usr/local/bin/* \
            .oss-scanner/run-variation \
            $(find src -path '*entrypoint.d*' -name '*.sh')

  hadolint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Dockerfiles
        run: docker run --rm -v "$PWD:/repo" -w /repo "hadolint/hadolint:${HADOLINT_VERSION}" hadolint src/variations/*/Dockerfile .oss-scanner/Dockerfile

  script-tests:
    name: scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs on a real runner on purpose: tool versions here (jq, yq) are what the
      # publish workflows use, and they differ from laptops.
      - name: Test the CI helper scripts
        run: bash scripts/tests/run.sh
